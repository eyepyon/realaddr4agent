name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-text-format.mjs
      - run: node --test scripts/deploy-event.test.mjs
      - run: node --test scripts/registry-deploy-client.test.mjs
      - run: node --test scripts/ens-parent-flow.test.mjs scripts/ens-parent-serve.test.mjs scripts/ens-parent-wrapper.test.mjs
      - run: node --test scripts/ens-upper-plan.test.mjs scripts/ens-upper-flow.test.mjs scripts/ens-upper-serve.test.mjs scripts/ens-upper-client.test.mjs
      - run: pnpm typecheck
      - run: pnpm build
        env:
          VITE_APP_ENV: local
          VITE_TERMS_VERSION: event-demo-1
      - run: pnpm test
