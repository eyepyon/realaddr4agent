name: Local container check

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docs/openapi.json'
      - 'scripts/container-*.mjs'
      - '.github/workflows/container-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docs/openapi.json'
      - 'scripts/container-*.mjs'
      - '.github/workflows/container-check.yml'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.0
      - run: node scripts/check-text-format.mjs
      - run: node scripts/container-smoke.mjs
